[package]
name = "riggerator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Riggerator — an open-source, Maya-style 3D modeling, rigging, animation and rendering app"

[dependencies]
rg-core.workspace = true
rg-io.workspace = true
rg-script.workspace = true
rg-render.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"
egui_glow = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

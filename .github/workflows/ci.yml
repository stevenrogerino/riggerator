name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libwayland-dev
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Batch render smoke test
        run: cargo run -p rg-batch -- -script examples/showcase.mel -render showcase.png
